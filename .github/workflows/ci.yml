name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      force_nuget_publish:
        description: Force NuGet publish # for non-master. The package version gets a suffix. See Create NuGet Package step
        type: boolean
        default: false

env:
  SOLUTION: src/NLog.sln

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Build & test (.NET 3.5, Windows)
            test_args: -p:targetFrameworks=net35
          - os: windows-latest
            name: Build & test (.NET 4.5, Windows)
            test_args: -p:targetFrameworks=net45
          - os: windows-latest
            name: Build & test (.NET 4.6, Windows)
            test_args: -p:targetFrameworks=net46
          - os: windows-latest
            name: Build & test (.NET Standard 2.0, Windows)
            test_args: -p:targetFrameworks=netstandard2.0
          - os: windows-latest
            name: Build & test (.NET Standard 2.1, Windows)
            test_args: -p:targetFrameworks=netstandard2.1
            trim_publish: true
          - os: ubuntu-latest
            name: Build & test (.NET Standard 2.0, Ubuntu)
            test_args: -p:TargetFrameworks=netstandard2.0
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Restore & Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-restore --no-build ${{ matrix.test_args }} --logger "console;verbosity=normal"

      - name: Build trim publish test project
        if: matrix.trim_publish
        run: dotnet build tests/TestTrimPublish/TestTrimPublish.csproj --configuration Release -p:TargetFramework=net10.0

  pack:
    name: Create NuGet package
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Determine version suffix
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF -eq "refs/heads/master") {
            echo "suffix=" >> $env:GITHUB_OUTPUT
          } elseif ($env:PR_NUMBER) {
            echo "suffix=pr.$($env:PR_NUMBER).ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          } else {
            echo "suffix=ci.$($env:RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          }

      - name: Create NuGet package
        shell: pwsh
        env:
          VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
        run: dotnet pack ${{ env.SOLUTION }} --no-restore --configuration Release --output artifacts -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:EmbedUntrackedSources=true -p:ContinuousIntegrationBuild=true --version-suffix "$env:VERSION_SUFFIX"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: NuGetPackages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: Publish NuGet package
    needs: [build, pack]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_nuget_publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: NuGetPackages
          path: artifacts

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
